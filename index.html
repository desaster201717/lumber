<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sawmill Tycoon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>

    <!-- HUD -->
    <div id="ui-overlay">
        <div id="gold-display">Gold: <span id="gold-amount">0</span></div>
        <div id="inventory-panel">
            <span class="panel-label">Rucksack</span>
            <span id="inventory-display">leer</span>
        </div>
    </div>

    <!-- Controls hint (bottom-right) -->
    <div id="controls-hint">Joystick: Bewegen  •  Blau: Abgeben  •  Grün: Aufnehmen</div>

    <!-- Virtual Joystick -->
    <div id="joystick-wrapper">
        <div id="joystick-base">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
